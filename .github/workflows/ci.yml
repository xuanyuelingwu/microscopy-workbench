name: Reproducibility tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Python 3.12 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned primary dependencies
        run: python -m pip install -r requirements.txt
      - name: Check the installed dependency graph
        run: python -m pip check
      - name: Numerical, export and distribution tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build the data-free release
        run: python package_release.py
